<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAINFIELD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="c"></canvas>

    <div id="menu">
      <div class="menu-shell">
        <h1>PAINFIELD</h1>
        <p class="tag">Loading…</p>
        <div class="mode-row">
          <button id="play" type="button">Play</button>
          <button id="event" type="button" class="alt">Endless</button>
          <button id="bomb" type="button" class="alt">Bomb</button>
          <button id="online" type="button" class="alt">Online</button>
        </div>
      </div>
    </div>

    <div id="intro" hidden>
      <p>one hit five lives...</p>
    </div>

    <div id="hud" hidden>
      <div class="crosshair" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <canvas id="radar" width="256" height="256" aria-hidden="true"></canvas>
      <div class="scoreline" id="match-score">
        <div class="pips" id="blue-pips"></div>
        <b id="score-blue">0</b>
        <i></i>
        <b id="score-red">0</b>
        <div class="pips red" id="red-pips"></div>
      </div>
      <div class="scoreline event" id="event-score" hidden>
        <b id="swarm-size">4</b>
      </div>
      <div class="ammo-quiet">
        <em id="gun-name">Glock</em>
        <span id="ammo">17</span>
        <b id="nades">1</b>
      </div>
      <div id="hp-bar"><i id="hp-fill"></i></div>
      <div id="use-prompt"></div>
      <div id="match-clock">3:00</div>
      <div id="bomb-hud" hidden>
        <div id="bomb-carry" hidden>C4</div>
        <div id="bomb-clock" hidden>0:40</div>
        <div id="bomb-bar" hidden><i></i></div>
        <div id="bomb-prompt"></div>
      </div>
      <div id="toast" class="toast"></div>
      <div id="feed" class="feed"></div>
    </div>

    <div id="pause" hidden>
      <div class="menu-shell slim">
        <h2>Paused</h2>
        <button id="resume" type="button">Continue</button>
      </div>
    </div>

    <div id="over" hidden>
      <div class="menu-shell">
        <p class="kicker" id="over-kicker"></p>
        <h1 id="over-title">DEFEAT</h1>
        <p class="tag" id="over-copy"></p>
        <button id="again" type="button">Again</button>
      </div>
    </div>

    <div id="hit-flash"></div>
    <div id="bomb-flash"></div>
    <div id="paint-vignette"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
